<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="Shield step: click Install, Unverified is normal, type your Mac password">
  <rect width="640" height="360" rx="18" fill="#fdf2f6"/>
  <circle cx="40" cy="40" r="20" fill="#c2185b"/><text x="40" y="47" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="72" y="47" font-size="18" font-weight="600" fill="#4a1f33">Click Install and type your Mac password</text>
  <rect x="160" y="72" width="320" height="236" rx="16" fill="#fff" stroke="#f0c6d8" stroke-width="2"/>
  <path d="M320 92 l24 9 v17 c0 15 -11 24 -24 30 c-13 -6 -24 -15 -24 -30 v-17 z" fill="#c2185b"/><path d="M309 120 l8 8 l14 -15" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="174" font-size="15" font-weight="700" fill="#2b1520" text-anchor="middle">Install “DataSecure Private Shield”?</text>
  <rect x="262" y="186" width="116" height="24" rx="12" fill="#fff4e5"/><text x="320" y="203" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Unverified</text>
  <text x="320" y="230" font-size="12" fill="#7a4a60" text-anchor="middle">That's normal: it was made on your own Mac.</text>
  <rect x="184" y="250" width="128" height="34" rx="9" fill="#f3e8ed"/><text x="248" y="272" font-size="14" fill="#4a1f33" text-anchor="middle">Cancel</text>
  <rect x="328" y="250" width="128" height="34" rx="9" fill="#c2185b"/><text x="392" y="272" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Install</text>
  <path d="M430 270 l0 30 l8 -7 l6 13 l6 -3 l-6 -12 l10 -1 z" fill="#2b1520" stroke="#fff" stroke-width="1.5"/>
  <text x="320" y="338" font-size="14" fill="#7a4a60" text-anchor="middle">Then go back to DataSecure and click “Test my shield”. It turns green.</text>
</svg>
