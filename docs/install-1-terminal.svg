<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="Step 1: press Command and Space, type Terminal, press return">
  <rect width="640" height="360" rx="18" fill="#fdf2f6"/>
  <circle cx="40" cy="40" r="20" fill="#c2185b"/><text x="40" y="47" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="72" y="47" font-size="18" font-weight="600" fill="#4a1f33">Open the Terminal app</text>
  <rect x="120" y="78" width="400" height="56" rx="12" fill="#fff" stroke="#f0c6d8" stroke-width="2"/>
  <circle cx="150" cy="104" r="9" fill="none" stroke="#9b6b80" stroke-width="3"/><path d="M157 111 L165 119" stroke="#9b6b80" stroke-width="3" stroke-linecap="round"/>
  <text x="178" y="114" font-size="22" fill="#2b1520">Terminal</text><rect x="272" y="92" width="2.5" height="26" fill="#c2185b"/>
  <rect x="120" y="142" width="400" height="58" rx="12" fill="#c2185b"/>
  <rect x="138" y="153" width="36" height="36" rx="8" fill="#1f1f1f"/><text x="145" y="177" font-size="15" font-weight="700" fill="#fff" font-family="Menlo, monospace">&gt;_</text>
  <text x="188" y="169" font-size="18" font-weight="600" fill="#fff">Terminal</text><text x="188" y="188" font-size="13" fill="#fff" opacity=".8">Utilities</text>
  <rect x="98" y="244" width="150" height="64" rx="12" fill="#fff" stroke="#e6b3c9" stroke-width="2"/><rect x="98" y="300" width="150" height="8" rx="4" fill="#e6b3c9"/>
  <text x="173" y="282" font-size="20" font-weight="600" fill="#4a1f33" text-anchor="middle">⌘ command</text>
  <text x="270" y="285" font-size="28" font-weight="700" fill="#c2185b" text-anchor="middle">+</text>
  <rect x="292" y="244" width="220" height="64" rx="12" fill="#fff" stroke="#e6b3c9" stroke-width="2"/><rect x="292" y="300" width="220" height="8" rx="4" fill="#e6b3c9"/>
  <text x="402" y="282" font-size="20" font-weight="600" fill="#4a1f33" text-anchor="middle">space</text>
  <text x="320" y="340" font-size="15" fill="#7a4a60" text-anchor="middle">Press both keys together, type Terminal, then press return.</text>
